<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fond -->
  <circle cx="32" cy="32" r="32" fill="#F3EAD9"/>

  <!-- Toit (pignon) -->
  <path d="M32 8 L54 30 L10 30 Z" fill="#E8CFA0" stroke="#6B3B1E" stroke-width="3" stroke-linejoin="round"/>

  <!-- Mur -->
  <rect x="10" y="30" width="44" height="24" fill="#E8CFA0" stroke="#6B3B1E" stroke-width="3" stroke-linejoin="round"/>

  <!-- Poteaux verticaux -->
  <g stroke="#6B3B1E" stroke-width="2.4" stroke-linecap="round">
    <line x1="24" y1="30" x2="24" y2="54"/>
    <line x1="40" y1="30" x2="40" y2="54"/>
  </g>

  <!-- Croix de Saint-André (travées gauche & droite) -->
  <g stroke="#6B3B1E" stroke-width="2.4" stroke-linecap="round">
    <line x1="11.5" y1="31.5" x2="23" y2="52.5"/>
    <line x1="23" y1="31.5" x2="11.5" y2="52.5"/>
    <line x1="52.5" y1="31.5" x2="41" y2="52.5"/>
    <line x1="41" y1="31.5" x2="52.5" y2="52.5"/>
  </g>

  <!-- Fenêtre centrale -->
  <rect x="27" y="35" width="10" height="12" rx="1" fill="#5F86A8" stroke="#6B3B1E" stroke-width="1.6"/>
  <g stroke="#FBF6EE" stroke-width="1.3">
    <line x1="32" y1="35.8" x2="32" y2="46.2"/>
    <line x1="27.8" y1="41" x2="36.2" y2="41"/>
  </g>
</svg>
